[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woodstitch-mcp"
version = "0.2.0"
description = "MCP server for the Woodstitch API: paid human listeners judge your text-to-speech audio in blinded pairwise preference or human-vs-AI detection studies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Woodstitch LLC", email = "support@woodstitch.com" }]
keywords = ["mcp", "model-context-protocol", "text-to-speech", "tts", "human-evaluation", "listening-test", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.urls]
Homepage = "https://woodstitch.com/evaluate"
Repository = "https://github.com/woodstitch-llc/woodstitch-mcp"
Issues = "https://github.com/woodstitch-llc/woodstitch-mcp/issues"
Documentation = "https://woodstitch.com/docs"
"OpenAPI spec" = "https://woodstitch.com/openapi.json"
Methodology = "https://woodstitch.com/research/methodology"
"Claude Code plugin" = "https://github.com/woodstitch-llc/claude-plugin"

[project.scripts]
woodstitch-mcp = "woodstitch_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woodstitch_mcp"]
